name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.1"
          elixir-version: "1.20.4"

      - name: Require an annotated release tag
        run: test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"

      - name: Validate tagged source
        run: elixir scripts/validate_release.exs --tag "$GITHUB_REF_NAME"

      - name: Test release changelog parser
        run: elixir scripts/release_changelog_test.exs

      - name: Read package version
        id: package
        run: echo "version=$(node --print 'require("./package.json").version')" >> "$GITHUB_OUTPUT"

      - name: Check script formatting
        run: mix format --check-formatted scripts/*.exs

      - name: Validate Kata catalog
        run: elixir skills/catalog.exs --check

      - name: Extract release notes
        env:
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: elixir scripts/release_notes.exs "$RELEASE_VERSION" > "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --title "Agent Jido Kata ${RELEASE_VERSION}"
