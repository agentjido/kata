name: Dojo Maintenance

on:
  pull_request:
    paths:
      - "dojo/**"
      - ".github/dependabot.yml"
      - ".github/workflows/dojo-maintenance.yml"
  push:
    branches: [main]
    paths:
      - "dojo/**"
      - ".github/dependabot.yml"
      - ".github/workflows/dojo-maintenance.yml"
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dojo-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dojo
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: "28.1"
          elixir-version: "1.20.4"

      - name: Install Dojo dependencies
        run: mix deps.get

      - name: Check Dojo
        run: mix maintenance
